  description: '中文小说与网文创作的来源路由入口。处理所有未被独立晋级的能力：开书定位、扫榜选题、拆文、大纲节奏、状态底账、信息边界、伏笔账本、逐章写作、短篇情绪、断点续写、去 AI 味、审查门禁、并行连写、逆向导入、失败模式诊断。Triggers: 写小说/网文/大纲/伏笔/去AI味/审稿/novel/writing'
promotion_budget: 8
