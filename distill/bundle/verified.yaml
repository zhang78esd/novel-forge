  - information-boundary
  card: cards/project-bootstrap.md
  frontmatter:
    description: '当用户只有模糊点子要开新书、需要确定题材/主角/核心冲突、建立故事承诺与设定词典时调用。产出定位卡、承诺卡、词典三份写前真源。不适用于已有旧稿续写（走 import-legacy）、市场选题（走 trend-scan）或已定定位后的章节排布。Triggers: 开书/新书/定题材/premise/story bible/start a novel'
