  slug: project-bootstrap
  title: 开书定位与创作合同
  importance: critical
  importance_rationale: 9 源中 3 源把「先签合同再动笔」列为起点；缺定位/承诺/词典会直接导致后续所有状态与伏笔能力失效，覆盖审计中「开书」关键任务无替代去向。
  one_liner: 先三层问答定定位，再固化四类故事承诺，最后建设定与事实词典；没有词典不许动笔。
  intents:
  - 我有个点子，想开一本新书
  - 帮我定题材、主角和核心冲突
  - 开写前要建项目与设定词典
  keywords:
